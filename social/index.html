<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a5acd">
  <title>梦里有zhi</title>
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="梦里有zhi">
</head>
<body>

<!-- 登录/注册页 -->
<div id="auth-page" class="auth-page">
  <div class="auth-card">
    <div class="logo">🌙</div>
    <h1>梦里有zhi</h1>
    <p class="auth-sub">需要邀请码才能注册（向朋友要）</p>

    <div class="tab-switch">
      <button id="btn-login-tab" class="tab-switch-btn active" onclick="showLogin()">登录</button>
      <button id="btn-reg-tab" class="tab-switch-btn" onclick="showRegister()">注册</button>
    </div>

    <div id="login-form">
      <input type="text" id="login-username" placeholder="昵称">
      <input type="password" id="login-password" placeholder="密码">
      <button class="primary-btn" onclick="doLogin()">进入</button>
    </div>

    <div id="register-form" style="display:none;">
      <input type="text" id="reg-username" placeholder="昵称（好友会看到）">
      <input type="email" id="reg-email" placeholder="邮箱">
      <input type="password" id="reg-password" placeholder="密码（至少6位）">
      <input type="text" id="reg-invite" placeholder="邀请码" style="text-transform:uppercase;">
      <button class="primary-btn" onclick="doRegister()">注册并进入</button>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="main-app" style="display:none;">

  <header class="top-bar">
    <h1>🌙 梦里有zhi</h1>
  </header>

  <main class="content">

    <!-- 动态页 -->
    <section id="tab-feed" class="tab-content">
      <div id="feed-manage-bar" style="display:none;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <button onclick="toggleSelectAll()" class="btn-secondary" style="flex:1;padding:8px;">全选</button>
          <button onclick="deleteSelected()" class="btn-danger" style="flex:1;padding:8px;">删除选中</button>
          <button onclick="exitManageMode()" class="btn-secondary" style="flex:1;padding:8px;">取消</button>
        </div>
      </div>
      <div style="padding:10px 16px;text-align:right;">
        <button id="btn-manage" onclick="enterManageMode()" class="btn-secondary" style="padding:4px 12px;font-size:13px;">🗑️ 管理</button>
      </div>
      <div id="feed"></div>
    </section>

    <!-- 发布页 -->
    <section id="tab-publish" class="tab-content" style="display:none;">
      <div class="publish-card">
        <textarea id="post-text" rows="5" placeholder="今天发生了什么？写下来吧...✨"></textarea>

        <img id="img-preview" style="display:none;max-width:100%;border-radius:12px;margin:10px 0;">
        <video id="video-preview" style="display:none;max-width:100%;border-radius:12px;margin:10px 0;" controls></video>

        <div class="sticker-bar">
          <span>🎀 贴纸：</span>
          <button class="sticker" onclick="addSticker('😊')">😊</button>
          <button class="sticker" onclick="addSticker('🥰')">🥰</button>
          <button class="sticker" onclick="addSticker('😢')">😢</button>
          <button class="sticker" onclick="addSticker('😴')">😴</button>
          <button class="sticker" onclick="addSticker('💫')">💫</button>
          <button class="sticker" onclick="addSticker('🌸')">🌸</button>
          <button class="sticker" onclick="addSticker('🌙')">🌙</button>
          <button class="sticker" onclick="addSticker('⭐')">⭐</button>
          <button class="sticker" onclick="addSticker('❤️')">❤️</button>
          <button class="sticker" onclick="addSticker('☕')">☕</button>
        </div>

        <div class="vis-box">
          <label>👁️ 谁能看：</label>
          <select id="visibility" onchange="onVisChange()">
            <option value="private">🔒 仅自己</option>
            <option value="friends">👥 所有好友</option>
            <option value="selected">📩 指定好友</option>
          </select>
        </div>

        <div id="friend-options" style="display:none;background:#f5f3ff;padding:12px;border-radius:10px;margin:10px 0;"></div>

        <div class="action-row">
          <button class="action-btn" onclick="addImage()">📷 图片</button>
          <button class="action-btn" onclick="addVideo()">🎬 视频</button>
        </div>
        <input type="file" id="img-input" accept="image/*" style="display:none;">
        <input type="file" id="video-input" accept="video/*" style="display:none;">

        <button class="primary-btn publish-btn" onclick="publishPost()">✨ 发布日记</button>
      </div>
    </section>

    <!-- 好友页 -->
    <section id="tab-friends" class="tab-content" style="display:none;">
      <div class="publish-card" id="friends-list"></div>
    </section>

    <!-- 设置页 -->
    <section id="tab-settings" class="tab-content" style="display:none;">
      <div class="publish-card">
        <h3>🎟️ 邀请码</h3>
        <p style="color:#888;font-size:13px;">把邀请码发给朋友，他注册时填上就能进来。</p>
        <button class="action-btn" onclick="generateInvite()">生成新邀请码</button>
        <div id="invite-list" style="margin-top:12px;"></div>
      </div>
      <div class="publish-card" style="margin-top:12px;">
        <h3>💾 数据管理</h3>
        <p style="color:#888;font-size:13px;">导出日记备份到本地，或从备份文件恢复。</p>
        <button class="action-btn" onclick="openExportModal()">📤 导出日记</button>
        <button class="action-btn" onclick="openImportModal()">📥 导入日记</button>
      </div>
      <div class="publish-card" style="margin-top:12px;">
        <h3>👤 个人信息</h3>
        <div id="profile-preview" style="display:flex;align-items:center;gap:12px;margin:12px 0;">
          <img id="profile-avatar-preview" src="" style="width:50px;height:50px;border-radius:50%;object-fit:cover;background:#eee;">
          <div>
            <div id="profile-name-preview" style="font-weight:600;color:#333;"></div>
            <div id="profile-email-preview" style="font-size:12px;color:#888;"></div>
          </div>
        </div>
        <button class="action-btn" onclick="openProfileModal()">✏️ 修改个人信息</button>
      </div>
      <div class="publish-card" style="margin-top:12px;">
        <h3>👤 我的账号</h3>
        <p id="my-username" style="color:#6c5ce7;font-weight:600;"></p>
        <button class="danger-btn" onclick="logout()">退出登录</button>
      </div>
    </section>

  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="tab-btn active" data-tab="feed" onclick="switchTab('feed')">
      <span class="nav-icon">🌙</span><span class="nav-label">动态</span>
    </button>
    <button class="tab-btn" data-tab="publish" onclick="switchTab('publish')">
      <span class="nav-icon">✏️</span><span class="nav-label">发布</span>
    </button>
    <button class="tab-btn" data-tab="friends" onclick="switchTab('friends')">
      <span class="nav-icon">👥</span><span class="nav-label">好友</span>
    </button>
    <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span><span class="nav-label">设置</span>
    </button>
  </nav>

</div>

<!-- 详情页 -->
<div id="detail-view" class="detail-view" style="display:none;">
  <div class="detail-card" id="detail-content"></div>
</div>

<!-- 导出弹窗 -->
<div id="export-modal" class="detail-view" style="display:none;">
  <div class="detail-card" style="max-width:420px;">
    <h3>📤 导出日记</h3>
    <div id="export-post-list" style="max-height:300px;overflow-y:auto;margin:12px 0;"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn-secondary" onclick="toggleExportAll()" style="margin:0;flex:1;">全选/反选</button>
      <button class="btn-danger" onclick="doExport()" style="margin:0;flex:1;">导出选中</button>
    </div>
    <button class="btn-secondary" onclick="closeExportModal()" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- 导入弹窗 -->
<div id="import-modal" class="detail-view" style="display:none;">
  <div class="detail-card" style="max-width:420px;">
    <h3>📥 导入日记</h3>
    <p style="color:#888;font-size:13px;">选择之前导出的 JSON 备份文件，将日记恢复到当前账号。</p>
    <input type="file" id="import-file" accept=".json" style="margin:12px 0;">
    <div id="import-preview" style="max-height:200px;overflow-y:auto;"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn-danger" onclick="doImport()" style="margin:0;flex:1;">确认导入</button>
      <button class="btn-secondary" onclick="closeImportModal()" style="margin:0;flex:1;">取消</button>
    </div>
  </div>
</div>

<!-- 个人信息编辑弹窗 -->
<div id="profile-modal" class="detail-view" style="display:none;">
  <div class="detail-card" style="max-width:420px;">
    <h3>✏️ 修改个人信息</h3>
    <div style="text-align:center;margin:16px 0;">
      <img id="profile-avatar-edit" src="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;background:#eee;cursor:pointer;" onclick="document.getElementById('avatar-input').click()">
      <input type="file" id="avatar-input" accept="image/*" style="display:none;">
      <p style="color:#888;font-size:12px;margin-top:8px;">点击头像更换（可裁剪）</p>
    </div>
    <label style="font-size:13px;color:#666;">昵称</label>
    <input type="text" id="edit-username" style="margin:6px 0 12px;">
    <label style="font-size:13px;color:#666;">邮箱</label>
    <input type="email" id="edit-email" style="margin:6px 0 12px;">
    <label style="font-size:13px;color:#666;">新密码（不填则不改）</label>
    <input type="password" id="edit-password" placeholder="至少6位" style="margin:6px 0 12px;">
    <div style="display:flex;gap:8px;">
      <button class="btn-danger" onclick="saveProfile()" style="margin:0;flex:1;">保存</button>
      <button class="btn-secondary" onclick="closeProfileModal()" style="margin:0;flex:1;">取消</button>
    </div>
  </div>
</div>

<!-- 头像裁剪弹窗 -->
<div id="cropper-modal" class="detail-view" style="display:none;z-index:10000;">
  <div class="detail-card" style="max-width:360px;padding:16px;">
    <h3 style="text-align:center;">✂️ 裁剪头像</h3>
    <p style="color:#888;font-size:12px;text-align:center;margin:8px 0;">拖动图片移动，用按钮或双指缩放</p>
    <div id="cropper-container" style="position:relative;width:280px;height:280px;margin:12px auto;overflow:hidden;border-radius:50%;background:#000;touch-action:none;">
      <canvas id="cropper-canvas" style="position:absolute;top:0;left:0;"></canvas>
      <div style="position:absolute;inset:0;border:3px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,0.5);"></div>
    </div>
    <div style="display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0;">
      <button onclick="zoomBy(-0.1)" style="width:44px;height:44px;border-radius:50%;border:none;background:#6c5ce7;color:#fff;font-size:22px;cursor:pointer;">−</button>
      <input type="range" id="zoom-slider" min="0.05" max="5" step="0.02" value="1" oninput="zoomSlider(this.value)">
      <button onclick="zoomBy(0.1)" style="width:44px;height:44px;border-radius:50%;border:none;background:#6c5ce7;color:#fff;font-size:22px;cursor:pointer;">+</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn-danger" onclick="confirmCrop()" style="margin:0;flex:1;">确认裁剪</button>
      <button class="btn-secondary" onclick="closeCropper()" style="margin:0;flex:1;">取消</button>
    </div>
  </div>
</div>

<script>
// 自动检测更新：如果 app.js 版本变了，自动刷新
const CURRENT_V = 14;
function checkUpdate() {
  fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text())
    .then(html => {
      const m = html.match(/app\.js\?v=(\d+)/);
      if (m && parseInt(m[1]) !== CURRENT_V) {
        location.reload();
      }
    })
    .catch(() => {});
}
// 页面打开时立即检查
checkUpdate();
// 每30秒检查一次
setInterval(checkUpdate, 30000);
// 从后台切回前台时检查（主屏幕 App 专属）
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkUpdate();
});
</script>
<script src="app.js?v=14"></script>
</body>
</html>
