<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a5acd">
  <title>梦里有zhi</title>
  <link rel="stylesheet" href="style.css">
  <!-- PWA 支持 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="purple">
</head>
<body>

  <!-- 启动密码页面 -->
  <div id="lock-screen" class="lock-screen hidden">
    <div class="lock-box">
      <div class="lock-emoji">🔒</div>
      <h2>梦里有zhi</h2>
      <p class="lock-sub">请输入访问密码</p>
      <input type="password" id="lock-password" placeholder="密码" autocomplete="off">
      <button id="lock-unlock">进入</button>
      <p class="lock-hint" id="lock-hint"></p>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app">

    <!-- 顶部背景 -->
    <div id="bg-layer" class="bg-layer"></div>

    <!-- 顶部导航 -->
    <header class="top-bar">
      <button class="nav-btn" data-tab="settings">⚙️</button>
      <h1 class="app-title">🌙 梦里有zhi</h1>
      <button class="nav-btn" data-tab="list">📖</button>
    </header>

    <!-- 内容区 -->
    <main id="main-content">

      <!-- 标签页 1: 发布日记 -->
      <section class="tab-content active" id="tab-publish">
        <div class="card">
          <textarea id="diary-text" placeholder="今天发生了什么？写下来吧...✨" rows="5"></textarea>

          <!-- 图片预览 -->
          <div id="image-preview" class="media-preview hidden">
            <button class="remove-media" data-type="image">×</button>
            <img id="preview-img" src="" alt="预览">
          </div>

          <!-- 视频预览 -->
          <div id="video-preview" class="media-preview hidden">
            <button class="remove-media" data-type="video">×</button>
            <video id="preview-video" controls></video>
          </div>

          <!-- 贴纸栏 -->
          <div class="sticker-bar">
            <span class="sticker-label">🎀 贴纸：</span>
            <div class="sticker-list" id="sticker-list">
              <button class="sticker-btn">😊</button>
              <button class="sticker-btn">🥰</button>
              <button class="sticker-btn">😢</button>
              <button class="sticker-btn">😴</button>
              <button class="sticker-btn">💫</button>
              <button class="sticker-btn">🌸</button>
              <button class="sticker-btn">🌙</button>
              <button class="sticker-btn">⭐</button>
              <button class="sticker-btn">🍀</button>
              <button class="sticker-btn">❤️</button>
              <button class="sticker-btn">☕</button>
              <button class="sticker-btn">🎵</button>
              <button class="sticker-btn">📷</button>
              <button class="sticker-btn">✈️</button>
              <button class="sticker-btn">🏠</button>
              <button class="sticker-btn">🎂</button>
              <button class="sticker-btn">🌈</button>
              <button class="sticker-btn">🔥</button>
              <button class="sticker-btn">💭</button>
              <button class="sticker-btn">👑</button>
            </div>
          </div>

          <!-- 可见范围选择 -->
          <div class="visibility-box">
            <span class="visibility-label">👁️ 谁能看：</span>
            <select id="visibility-select">
              <option value="private">仅自己见 🔒</option>
              <option value="invite">邀请码可见 📩</option>
              <option value="public">公开 🌐</option>
            </select>
          </div>

          <!-- 邀请码输入（仅当选择 invite 时显示） -->
          <div class="invite-box hidden" id="invite-box">
            <input type="text" id="invite-code" placeholder="输入邀请码（多个用逗号分隔）">
          </div>

          <!-- 操作按钮 -->
          <div class="action-row">
            <button class="action-btn" id="btn-image" title="上传图片">
              📷 图片
              <input type="file" id="file-image" accept="image/*" hidden>
            </button>
            <button class="action-btn" id="btn-video" title="上传视频">
              🎬 视频
              <input type="file" id="file-video" accept="video/*" hidden>
            </button>
          </div>

          <button id="btn-publish" class="publish-btn">✨ 发布日记</button>
        </div>
      </section>

      <!-- 标签页 2: 日记列表 -->
      <section class="tab-content" id="tab-list">
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="private">🔒 仅自己</button>
          <button class="filter-btn" data-filter="invite">📩 邀请可见</button>
          <button class="filter-btn" data-filter="public">🌐 公开</button>
        </div>
        <div id="diary-list" class="diary-list"></div>
        <div id="empty-tip" class="empty-tip hidden">
          <div class="empty-emoji">🌙</div>
          <p>还没有日记哦～</p>
          <p>去上面发布第一篇吧！</p>
        </div>
      </section>

      <!-- 标签页 3: 设置 -->
      <section class="tab-content" id="tab-settings">
        <div class="card">
          <h3 class="card-title">🖼️ 背景设置</h3>
          <div class="setting-row">
            <span>当前背景</span>
            <div class="setting-actions">
              <button id="btn-bg-upload" class="mini-btn">📁 上传图片</button>
              <button id="btn-bg-reset" class="mini-btn">🗑️ 清除</button>
              <input type="file" id="file-bg" accept="image/*" hidden>
            </div>
          </div>
          <div class="bg-preview" id="bg-preview">
            <span>默认渐变背景</span>
          </div>
        </div>

        <div class="card">
          <h3 class="card-title">🔐 访问密码</h3>
          <p class="hint-text">设置后，只有知道密码的人才能打开这个应用</p>
          <div class="setting-row">
            <input type="password" id="pwd-input" placeholder="设置新密码">
          </div>
          <div class="setting-row">
            <input type="password" id="pwd-confirm" placeholder="确认密码">
          </div>
          <button id="btn-set-password" class="publish-btn small">保存密码</button>
          <button id="btn-clear-password" class="publish-btn small ghost">取消密码</button>
        </div>

        <div class="card">
          <h3 class="card-title">📦 数据管理</h3>
          <div class="setting-row">
            <span>导出所有日记</span>
            <button id="btn-export" class="mini-btn">💾 导出 JSON</button>
          </div>
          <div class="setting-row">
            <span>导入日记数据</span>
            <button id="btn-import" class="mini-btn">📥 导入</button>
            <input type="file" id="file-import" accept=".json" hidden>
          </div>
          <div class="setting-row danger-row">
            <span>⚠️ 删除所有日记</span>
            <button id="btn-clear-all" class="mini-btn danger">🗑️ 全部删除</button>
          </div>
        </div>

        <div class="card">
          <h3 class="card-title">ℹ️ 关于</h3>
          <p class="hint-text">「梦里有zhi」v1.0</p>
          <p class="hint-text">数据存在你自己的手机浏览器里，安全私密 ✨</p>
        </div>
      </section>

    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="publish">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">发布</span>
      </button>
      <button class="nav-item" data-tab="list">
        <span class="nav-icon">📖</span>
        <span class="nav-label">日记</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">设置</span>
      </button>
    </nav>

  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 大图查看模态框 -->
  <div id="image-modal" class="modal hidden">
    <button class="modal-close">×</button>
    <img id="modal-img" src="" alt="">
  </div>

  <!-- 确认删除模态框 -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="confirm-title">确认删除？</h3>
      <p id="confirm-text">此操作不可恢复</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="mini-btn">取消</button>
        <button id="confirm-ok" class="mini-btn danger">确定</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
